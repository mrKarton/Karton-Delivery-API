plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url 'https://jitpack.io' }

	// Needed to FancyGUI dependencies
	maven {
		url = uri("https://maven.nucleoid.xyz")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "me.lucko:fabric-permissions-api:0.7.0"
	implementation include("org.xerial:sqlite-jdbc:3.40.0.0")

	implementation 'com.github.mrKarton:Fancy-GUI:0.3.4'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			groupId = project.group.toString()
			artifactId = "karton-delivery-api"
			version = project.version.toString()

			from components.java

			pom {
				name = "Karton Delivery API"
				description = "A simple API that allows to send player items. (Even offline players)"
				url = "https://github.com/mrKarton/Karton-Delivery-API"

				licenses {
					license {
						name = "MIT"
						url = "https://opensource.org/licenses/MIT"
					}
				}

				scm {
					url = "https://github.com/mrKarton/Karton-Delivery-API"
					connection = "scm:git:https://github.com/mrKarton/Karton-Delivery-API.git"
				}
			}
		}
	}

	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/mrKarton/Karton-Delivery-API")

			credentials {
				username = providers.gradleProperty("gpr.user")
						.orElse(providers.environmentVariable("GITHUB_ACTOR"))
						.getOrNull()

				password = providers.gradleProperty("gpr.key")
						.orElse(providers.environmentVariable("GITHUB_TOKEN"))
						.getOrNull()
			}
		}
	}
}
